remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: "dark"

title: kings-xiaowang
name: kings-xiaowang
description: 嵌入式 / 开源爱好者 | Furry OC创作者
locale: "zh-CN"
url: "https://kings-xiaowang.github.io"
baseurl: ""

author:
  name: kings-xiaowang
  bio: 擅长ESP32、树莓派底层折腾；3D打印、开源项目爱好者。
  avatar: "/assets/images/avatar.png"
  location: China
  links:
    - label: "介绍"
      icon: "fas fa-fw fa-home"
      url: "/"
    - label: "项目"
      icon: "fas fa-fw fa-folder-open"
      url: "/projects/"
